name: build and test
on:
  push:
    branches:
      - main


jobs:
  build-and-test-job:
    runs-on: ubuntu-latest
    services:
        mysql:
          image: mysql:8.0
          env:
            MYSQL_ROOT_PASSWORD: Varun@17
            MYSQL_DATABASE: githunactiondemo
          ports:
            - 3306:3306
          options: >-
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=10
    steps:
     # 2. Download source code
      - name: code checkout
        uses: actions/checkout@v7
      # 3. Install Java 21
      - name: install java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 4. Build and test Spring Boot application
      - name: Maven build and test
        run: mvn clean verify
        env:
            SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/githunactiondemo
            SPRING_DATASOURCE_USERNAME: root
      # 5. Build Docker image
      - name: docker image build
        run: docker build -t velu31/githubaction_demo:t1 .

      # 6. Login to Docker Hub

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      # 7. Push image to Docker Hub

      - name: docker image push
        run: docker push velu31/githubaction_demo:t1





