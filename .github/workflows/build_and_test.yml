name: build and test
on:
  push:
    branches:
      - main


jobs:
  build-and-test-job:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7
      - name: install java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: java version
        run: java --version
      - name: mavan
        run: mvn --version